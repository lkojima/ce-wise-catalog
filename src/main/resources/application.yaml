spring:
  application:
    name: ce-sage-catalog
  data:
    mongodb:
      host: ${SPRING_DATA_MONGODB_HOST:localhost}
      port: ${SPRING_DATA_MONGODB_PORT:27017}
      database: ${SPRING_DATA_MONGODB_DATABASE:local}
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:wisepass}
api:
  security:
    token:
      secret: ${JWT_SECRET:srv-token-secret}
server:
  port: 8080
  servlet:
    context-path: /ce-wise-catalog
